services:
  account-pool-manager:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POOL_MANAGER_HOST: 0.0.0.0
      POOL_MANAGER_SECURE_COOKIE: "true"
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
